name: Create new DOI URL, update JSON Schema accordingly and publish on Zenodo 

on:
  pull_request_review:
    types: [submitted]
    branches: 
      - main
      - 'releases/**'

jobs:
  publish:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv version
          uv sync

      - name: configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Run validation script before updating schema & example definitions
        run: uv run python schemas/validate_definitions.py example_definitions/
    
      - name: >
          Update schema & example definitions, validate again, commit to git and
          publish to Zenodo
        env: 
          ZENODO_API_KEY: ${{secrets.ZENODO_API_KEY}}
        run: |
          cd .github/workflows
          uv run python -m tools.publish_on_zenodo

          