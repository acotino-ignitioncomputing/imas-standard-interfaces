name: Create new DOI URL, update JSON Schema accordingly and publish on Zenodo 

on:
  workflow_dispatch:
    

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.16"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv version
          uv sync

      - name: configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Run validation script before updating schema & example definitions
        run: uv run python schemas/validate_definitions.py example_definitions/

      - name: create draft deposition
        uses: zenodraft/action@0.13.3
        env: 
          ZENODO_SANDBOX_ACCESS_TOKEN: ${{secrets.ZENODO_API_KEY}}
        with:
          sandbox: true
          publish: false
          concept: 498829 # 'concept id', supposed to be "identifier for all versions"
          upsert-doi: true
          upsert-location: doi # store in file CITATION.cff in root under key 'doi'

      - name : update schema and example definitions with new doi
        run: |
          cd .github/workflow
          uv run python -m tools.update_doi_value
      
      - name: Run validation script again before publishing
        run: uv run python schemas/validate_definitions.py example_definitions/

      - name: Commit to git
        run: |
          set -x -e -o pipefail

          git add example_definitions/**/*.yaml schemas/json_schema.json
          git commit -m "Github Actions: updated schema and definitions with new DOI URL"
          git push

      - name: Publish to Zenodo
        uses: zenodraft/action@0.13.3
        env: 
          ZENODO_SANDBOX_ACCESS_TOKEN: ${{secrets.ZENODO_API_KEY}}
        with:
          sandbox: true
          publish: true
          concept: 498829 # 'concept id', supposed to be "identifier for all versions"
          filenames: schemas/json_schema.json
          metadata: .github/workflows/.zenodo.json

          