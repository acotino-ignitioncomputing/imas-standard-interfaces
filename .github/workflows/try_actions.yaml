name: Try some functionaltiy of github actions

on:
  push: # Remove this line before removing draft status of PR 


jobs:
  tryout:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Git related stuff
        run: |
          git status
          git branch
          git log -2

      - name: configure git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

      - name: Change file and push
        run: |
          echo "# SOME Other CHANGE" >> schemas/validate_definitions.py
          git add schemas/validate_definitions.py
          git commit -m "Github Actions: update script"
          git push
          git log -3
