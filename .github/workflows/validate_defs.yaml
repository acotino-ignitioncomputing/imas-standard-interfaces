name: Validate example definitions against schema

on:
  pull_request:
    types: [opened, closed]
    branches: 
      - main
      - 'releases/**'
  pull_request_review:
    types: [submitted]
    branches: 
      - main
      - 'releases/**'

jobs:
  validate:
    if: >
      github.event.review.state == 'approved' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.5.16"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv version
          uv sync

      - name: Run validation script
        run: uv run imas-interfaces validate example_definitions/
