name: Validate example definitions against schema

on:
  pull_request:
    types: [opened, closed]
    branches: 
      - main
      - 'releases/**'
  pull_request_review:
    types: [submitted]
    branches: 
      - main
      - 'releases/**'

jobs:
  validate:
    if: >
      github.event.review.state == 'approved' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.30"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv version
          uv sync

      - name: Run validation script
        run: uv run imas-interfaces validate example_definitions/
