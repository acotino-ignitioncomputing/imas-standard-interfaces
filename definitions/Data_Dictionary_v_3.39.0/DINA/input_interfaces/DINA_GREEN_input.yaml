dd_version: 3.39.0

ids:
  - name: pf_active
    required_paths:
    - coil(i1)/element(i2)/turns_with_sign
    constraints:
    - path: [coil(i1)/element(i2)/geometry/geometry_type]
      allowed_values: [2, 3, 5]

  - name: pf_passive
    constraints:
    - path: [loop(i1)/element(1)/geometry/geometry_type]
      allowed_values: [2, 3]

  - name: magnetics
    required_paths:
    - flux_loop(i1)/position(1)/r
    - flux_loop(i1)/position(1)/z
    - b_field_pol_probe(i1)/position/r
    - b_field_pol_probe(i1)/position/z
    - b_field_pol_probe(i1)/poloidal_angle
    - b_field_pol_probe(i1)/length

  - name: equilibrium
    required_paths:
    - time_slice(1)/profiles_2d(1)/grid/dim1
    - time_slice(1)/profiles_2d(1)/grid/dim2
