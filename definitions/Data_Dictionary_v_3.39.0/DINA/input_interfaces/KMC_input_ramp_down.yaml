dd_version: 3.39.0

ids:
  # Pulse_schedule input (pulse_schedule_term): ramp-down phase
  - name: pulse_schedule
    required_paths:
    - position_control/gap(i1)/value/reference/data
    - position_control/gap(i1)/value/reference/time
    constraints:
    - path:
      - position_control/gap(i1)/value/reference/data
      - position_control/gap(i1)/value/reference/time
      same_shape:

  - name: equilibrium
    required_paths:
    - time_slice(1)/time
    - time_slice(1)/global_quantities/ip
    - time_slice(1)/global_quantities/current_centre/z
    - time_slice(1)/boundary/type
    - time_slice(1)/boundary/elongation
    - time_slice(1)/boundary/geometric_axis/r
    - time_slice(1)/boundary/minor_radius
    - time_slice(1)/boundary_separatrix/gap(24)/value
    - time_slice(1)/boundary_separatrix/gap(25)/value
    - time_slice(1)/boundary_separatrix/gap(26)/value
    - time_slice(1)/boundary_separatrix/gap(27)/value
    - time_slice(1)/boundary_separatrix/gap(28)/value
    - time_slice(1)/boundary_separatrix/gap(29)/value

  - name: pf_active
    required_paths:
    - coil(i1)/current/data
