dd_version: 3.39.0

ids:
  # Pulse_schedule input: ramp-up and flattop phase
  - name: pulse_schedule
    required_paths:
    - flux_control/i_plasma/reference/data
    - pf_active/coil(i1)/current/reference/data
    - pf_active/coil(i1)/current/reference/time
    - pf_active/supply(i1)/voltage/reference/data
    - pf_active/supply(i1)/voltage/reference/time
    - position_control/elongation/reference/data
    - position_control/elongation/reference/time
    - position_control/gap(i1)/value/reference/data
    - position_control/gap(i1)/value/reference/time
    constraints:
    - path:
      - flux_control/i_plasma/reference/data
      - pf_active/coil(i1)/current/reference/data
      - pf_active/coil(i1)/current/reference/time
      same_shape:
    - path:
      - pf_active/supply(i1)/voltage/reference/data
      - pf_active/supply(i1)/voltage/reference/time
      same_shape:
    - path:
      - position_control/elongation/reference/data
      - position_control/elongation/reference/time
      same_shape:
    - path:
      - position_control/gap(i1)/value/reference/data
      - position_control/gap(i1)/value/reference/time
      same_shape:

  - name: equilibrium
    required_paths:
    - time_slice(0)/time
    - time_slice(0)/global_quantities/ip
    - time_slice(0)/global_quantities/current_centre/z
    - time_slice(0)/boundary/type
    - time_slice(0)/boundary/elongation
    - time_slice(0)/boundary/geometric_axis/r
    - time_slice(0)/boundary/minor_radius
    - time_slice(0)/boundary_separatrix/gap(24)/value
    - time_slice(0)/boundary_separatrix/gap(25)/value
    - time_slice(0)/boundary_separatrix/gap(26)/value
    - time_slice(0)/boundary_separatrix/gap(27)/value
    - time_slice(0)/boundary_separatrix/gap(28)/value
    - time_slice(0)/boundary_separatrix/gap(29)/value

  - name: pf_active
    required_paths:
    - coil(i1)/current/data
