dd_version: 3.42.0

ids:
  - name: equilibrium
    required_paths:
    - vacuum_toroidal_field/r0
    - vacuum_toroidal_field/b0
    - time_slice(itime)/global_quantities/ip
    - time_slice(itime)/global_quantities/psi_axis
    - time_slice(itime)/global_quantities/psi_boundary
    - time_slice(itime)/profiles_1d/psi
    - time_slice(itime)/profiles_1d/pressure
    - time_slice(itime)/profiles_1d/dpressure_dpsi
    - time_slice(itime)/profiles_1d/f_df_dpsi
    - time_slice(itime)/profiles_1d/q
    - time_slice(itime)/profiles_2d(i1)/grid_type/index

    constraints:
    - path:
      - time_slice(itime)/boundary/outline/r
      - time_slice(itime)/profiles_2d(i1)/psi
      at_least_one_present:
    - path:
      - time_slice(itime)/profiles_1d/psi
      - time_slice(itime)/profiles_1d/pressure
      - time_slice(itime)/profiles_1d/dpressure_dpsi
      - time_slice(itime)/profiles_1d/f_df_dpsi
      same_shape:
