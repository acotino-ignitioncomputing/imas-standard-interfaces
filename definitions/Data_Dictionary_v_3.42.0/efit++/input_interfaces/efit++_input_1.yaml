dd_version: 3.42.0

include_all: # list of relative paths to interface definitions
- ../building_blocks/magnetics.yaml
- ../building_blocks/pf_active.yaml
- ../building_blocks/pf_passive.yaml
- ../building_blocks/tf.yaml
- ../building_blocks/wall.yaml

include_any: # list of sublist of relative file paths
- - ../../general_building_blocks/pf_active/pf_active_coil_element_geometry_rectangle.yaml
  - ../../general_building_blocks/pf_active/pf_active_coil_element_geometry_oblique.yaml
  - ../../general_building_blocks/pf_active/pf_active_coil_element_geometry_annulus.yaml
  - ../../general_building_blocks/pf_active/pf_active_coil_element_geometry_thick_line.yaml
- - ../../general_building_blocks/pf_passive/pf_passive_loop_element_geometry_rectangle.yaml
  - ../../general_building_blocks/pf_passive/pf_passive_loop_element_geometry_oblique.yaml
  - ../../general_building_blocks/pf_passive/pf_passive_loop_element_geometry_annulus.yaml
  - ../../general_building_blocks/pf_passive/pf_passive_loop_element_geometry_thick_line.yaml

ids:
  - name: magnetics
    required_paths:
    - time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [1]
  
  - name: tf
    required_paths:
    - time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [1]

  - name: pf_active
    required_paths:
    - time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [1]

  - name: pf_passive
    required_paths:
    - time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [1]
