dd_version: 3.42.0

include: # list of relative paths to interface definitions
- ../building_blocks/magnetics.yaml
- ../building_blocks/pf_active.yaml
- ../building_blocks/pf_passive.yaml
- ../building_blocks/tf.yaml
- ../building_blocks/wall.yaml

ids:
  - name: magnetics
    required_paths:
    - b_field_pol_probe(i1)/field/time
    - flux_loop(i1)/flux/time
    - ip(i1)/time
    - diamagnetic_flux(i1)/time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [0]
  
  - name: tf
    required_paths:
    - b_field_phi_vacuum_r/time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [0]

  - name: pf_active
    required_paths:
    - circuit(i1)/current/time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [0]

  - name: pf_passive
    required_paths:
    - loop(i1)/time
    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [0]
