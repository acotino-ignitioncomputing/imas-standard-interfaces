dd_version: 3.42.0
ids:
  - name: pf_passive
    required_paths:
    - loop(i1)/name
    - loop(i1)/element(i2)/turns_with_sign
    - loop(i1)/current

    constraints:
    - path: [loop(i1)/element(i2)/geometry/geometry_type]
      allowed_values: [2,3,5,6]
    - path: [ids_properties/homogeneous_time]
      allowed_values: [0,1]
