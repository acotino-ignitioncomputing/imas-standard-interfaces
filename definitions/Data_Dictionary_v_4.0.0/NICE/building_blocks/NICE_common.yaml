dd_version: 4.0.0 # TODO: check for compatible version

ids:
  - name: equilibrium
    required_paths:
    - ids_properties/version_put/data_dictionary
    - vacuum_toroidal_field/r0

  - name: wall
    required_paths:
    - ids_properties/version_put/data_dictionary
    - description_2d(0)/vessel/unit(i2)/annular/restitivity
    - description_2d(0)/limiter/unit(i2)/outline/r
    - description_2d(0)/limiter/unit(i2)/outline/z
    - description_2d(0)/mobile/unit(i2)/outline(0)/r # NOTE: Not in PDS input desciption, but mentioned in spreadsheet
    - description_2d(0)/mobile/unit(i2)/outline(0)/z
    
    #constraints:
    #- # TODO: think of options in geometry of wall.description_2d(0).vessel.unit 
    # where DD has no geometry type. For now, just picked centreline

  - name: pf_active
    required_paths:
    - ids_properties/version_put/data_dictionary
    - coil(i1)/element/turns_with_sign
    - coil(i1)/resistance

  - name: pf_passive
    required_paths:
    - ids_properties/version_put/data_dictionary
    - loop(i1)/resistance

    constraints:
    - path: [loop(i1)/element(0)/geometry/geometry_type]
      allowed_values: [1,2] # CHECK source code: spreadsheet mentions type 3 is also handled



