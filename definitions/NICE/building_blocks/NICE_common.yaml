dd_version: 4.1.0 # TODO: check for compatible version

ids:
  - ids_name: equilibrium
    required_paths:
    - ids_properties/version_put/data_dictionary
    - vacuum_toroidal_field/r0

  - ids_name: wall
    required_paths:
    - ids_properties/version_put/data_dictionary
    - description_2d(0)/vessel/unit(i2)/annular/restitivity
    - description_2d(0)/limiter/unit(i2)/outline/r
    - description_2d(0)/limiter/unit(i2)/outline/z

    - description_2d(0)/vessel/unit(0)/annular/centreline/r
    - description_2d(0)/vessel/unit(0)/annular/centreline/z
    - description_2d(0)/vessel/unit(0)/annular/thickness
    - description_2d(0)/vessel/unit(1)/annular/centreline/r
    - description_2d(0)/vessel/unit(1)/annular/centreline/z
    - description_2d(0)/vessel/unit(1)/annular/thickness

    - description_2d(0)/mobile/unit(i2)/outline(0)/r # NOTE: Not in PDS input desciption, but mentioned in spreadsheet
    - description_2d(0)/mobile/unit(i2)/outline(0)/z
    
    constraints:
    - # TODO: think of options in geometry of wall.description_2d(0).vessel.unit 
    # where DD has no geometry type. For now, just picked centreline

  - ids_name: pf_active
    required_paths:
    - ids_properties/version_put/data_dictionary
    - coil(i1)/element/turns_with_sign
    - coil(i1)/resistance

    constraints:
    - path: coil(i1)/element(0)/geometry/geometry_type
      allowed_values: [2] # Code also allows 1. Seperate definition?
    - path: # TODO: In case geometry_type = 2, and DDv4. Seperate definition?
      - coil(i1)/element(0)/geometry/outline/r
      - coil(i1)/element(0)/geometry/outline/z
      has_shape: [5]

  - ids_name: pf_passive
    required_paths:
    - ids_properties/version_put/data_dictionary
    - loop(i1)/resistance

    constraints:
    - path: loop(i1)/element(0)/geometry/geometry_type
      allowed_values: [1,2] # spreadsheet mentions type 3 is also handled



# ADD for "NICE inverse": pf_active.circuit(i).connections(j,k), pf_active.supply
