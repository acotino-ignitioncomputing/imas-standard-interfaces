dd_version: 4.1.0 # TODO: check for compatible version

include:
- ../building_blocks/NICE_common.yaml
- ../building_blocks/NICE_vessel_wall_2.yaml

ids:
  - ids_name: equilibrium
    required_paths:
    - time(0)
    - time_slice(0)/global_quantities/ip
    - vacuum_toroidal_field/b0
    - time_slice(0)/boundary/outline/r
    - time_slice(0)/boundary/outline/z


    constraints:
    - path: # TODO: check source code for this 
      - time_slice(0)/profiles_1d/dpressure_dpsi
      - time_slice(0)/profiles_1d/f_df_dpsi
      at_least_one_present:
      
  - ids_name: pf_active
    constraints:
    - path: [coil(i1)/element(0)/geometry/geometry_type]
      allowed_values: [2]
