id: https://imas.iter.org/schemas/pf_active
name: pf_active
description: Interface definition for the pf_active IDS
version: "4.1.0"

prefixes:
  linkml: https://w3id.org/linkml/
  imas: https://imas.iter.org/schemas/

imports:
  - linkml:types

classes:
  pf_active:
    description: PF active coils IDS interface definition
    attributes:
      coil.name:
        description: Name of the coil
        required: true
      coil.element.turns_with_sign:
        description: Turns with sign of the coil element
        required: true
      coil.element.geometry.geometry_type:
        description: Geometry type of the coil element
        required: true
        range: GeometryTypeEnum
      circuit.connections:
        description: Circuit connections
        required: true
      circuit.current.data:
        description: Circuit current data
        required: true
      supply.name:
        description: Name of the power supply
        required: true
      ids_properties.homogeneous_time:
        description: Homogeneous time flag for the IDS
        required: true
        range: HomogeneousTimeEnum

enums:
  GeometryTypeEnum:
    description: Allowed geometry types (outline, rectangle, annulus)
    permissible_values:
      1:
        description: Outline
      2:
        description: Rectangle
      5:
        description: Annulus

  HomogeneousTimeEnum:
    description: Allowed values for homogeneous_time
    permissible_values:
      0:
        description: Non-homogeneous time
      1:
        description: Homogeneous time
