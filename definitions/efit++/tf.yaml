id: https://imas.iter.org/schemas/tf
name: tf
description: Interface definition for the tf IDS
version: "4.1.0"

prefixes:
  linkml: https://w3id.org/linkml/
  imas: https://imas.iter.org/schemas/

imports:
  - linkml:types

classes:
  tf:
    description: Toroidal field IDS interface definition
    attributes:
      b_field_phi_vacuum_r.data:
        description: Vacuum toroidal field times major radius data
        required: true
      ids_properties.homogeneous_time:
        description: Homogeneous time flag for the IDS
        required: true
        range: HomogeneousTimeEnum

enums:
  HomogeneousTimeEnum:
    description: Allowed values for homogeneous_time
    permissible_values:
      0:
        description: Non-homogeneous time
      1:
        description: Homogeneous time
