dd_version: 4.0.0

ids:
  - ids_name: core_profiles
    required_paths:
    - profiles_1d(itime)/grid/rho_tor_norm
    - profiles_1d(itime)/time
    - profiles_1d(itime)/electrons/temperature
    - profiles_1d(itime)/electrons/density
    - profiles_1d(itime)/ion(i1)/density
    - profiles_1d(itime)/ion(i1)/name
    - profiles_1d(itime)/grid/psi
    - profiles_1d(itime)/zeff
    - global_quantities/ip
    - global_quantities/v_loop

    constraints:
    - path:
      - profiles_1d(itime)/t_i_average
      - profiles_1d(itime)/ion(i1)/temperature
      at_least_one_present:

  - ids_name: equilibrium
    required_paths:
    - time
    - vacuum_toroidal_field/r0
    - vacuum_toroidal_field/b0
    - time_slice(itime)/profiles_1d/psi
    - time_slice(itime)/profiles_1d/phi
    - time_slice(itime)/profiles_1d/r_inboard
    - time_slice(itime)/profiles_1d/r_outboard
    - time_slice(itime)/profiles_1d/f
    - time_slice(itime)/profiles_1d/j_phi
    - time_slice(itime)/profiles_1d/gm1
    - time_slice(itime)/profiles_1d/gm2
    - time_slice(itime)/profiles_1d/gm3
    - time_slice(itime)/profiles_1d/gm4
    - time_slice(itime)/profiles_1d/gm5
    - time_slice(itime)/profiles_1d/gm7
    - time_slice(itime)/profiles_1d/triangularity_upper
    - time_slice(itime)/profiles_1d/triangularity_lower
    - time_slice(itime)/profiles_1d/elongation
    - time_slice(itime)/global_quantities/ip
    - time_slice(itime)/global_quantities/magnetic_axis/z
    - time_slice(itime)/boundary/minor_radius
    - time_slice(itime)/boundary/type

    constraints:
    - path:
      - time_slice(itime)/profiles_1d/dvolume_dpsi
      - time_slice(itime)/profiles_1d/volume
      at_least_one_present:
    - path:
      - time_slice(itime)/profiles_1d/dpsi_drho_tor
      - time_slice(itime)/profiles_1d/rho_tor
      at_least_one_present:
    - path:
      - time_slice(itime)/profiles_1d/rho_tor_norm
      - time_slice(itime)/profiles_1d/phi
      at_least_one_present:
    - path:
      - time_slice(itime)/profiles_1d/gm9
      - time_slice(itime)/profiles_1d/r_inboard
      - time_slice(itime)/profiles_1d/r_outboard
      at_least_one_present:

  - ids_name: core_sources
    required_paths:
    - source(i1)/identifier/name
    - source(i1)/profiles_1d(itime)/grid/rho_tor_norm
    - source(i1)/profiles_1d(itime)/time
    - source(i1)/profiles_1d(itime)/j_parallel
    - source(i1)/profiles_1d(itime)/total_ion_energy
    - source(i1)/profiles_1d(itime)/electrons/energy
    - source(i1)/profiles_1d(itime)/electrons/particles
