    - time_slice(itime)/profiles_1d/rho_tor_norm
    - time_slice(itime)/profiles_1d/dpsi_drho_tor
    - time_slice(itime)/profiles_1d/geometric_axis/r
    - time_slice(itime)/profiles_1d/geometric_axis/z
    - time_slice(itime)/profiles_1d/elongation
    - time_slice(itime)/profiles_1d/triangularity_upper
    - time_slice(itime)/profiles_1d/triangularity_lower
    - time_slice(itime)/profiles_1d/volume
    - time_slice(itime)/profiles_1d/rho_volume_norm
    - time_slice(itime)/profiles_1d/dvolume_dpsi
    - time_slice(itime)/profiles_1d/dvolume_drho_tor
