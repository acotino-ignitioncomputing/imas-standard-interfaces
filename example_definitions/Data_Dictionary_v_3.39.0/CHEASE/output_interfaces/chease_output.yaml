    - time_slice(itime)/coordinate_system/grid_type/index
    - time_slice(itime)/coordinate_system/grid_type/name
    - time_slice(itime)/coordinate_system/grid_type/description
    - time_slice(itime)/coordinate_system/grid/dim1
    - time_slice(itime)/coordinate_system/grid/dim2
    - time_slice(itime)/coordinate_system/r
    - time_slice(itime)/coordinate_system/z
    - time_slice(itime)/coordinate_system/jacobian
    - time_slice(itime)/coordinate_system/tensor_contravariant

    constraints:
    - path: [ids_properties/homogeneous_time]
      allowed_values: [1]
