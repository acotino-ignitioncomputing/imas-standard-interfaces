dd_version: 3.39.0

ids:
  - name: equilibrium
    required_paths:
    # time base
    - time
    # vacuum toroidal field
    - vacuum_toroidal_field/r0
    - vacuum_toroidal_field/b0
    # code metadata
    - code/name
    - code/version
    - code/parameters
    - code/output_flag
    # boundary geometry
    - time_slice(itime)/boundary/type
    - time_slice(itime)/boundary/outline/r
    - time_slice(itime)/boundary/outline/z
    - time_slice(itime)/boundary/psi_norm
    - time_slice(itime)/boundary/geometric_axis/r
    - time_slice(itime)/boundary/geometric_axis/z
    - time_slice(itime)/boundary/minor_radius
    - time_slice(itime)/boundary/elongation
    - time_slice(itime)/boundary/elongation_upper
    - time_slice(itime)/boundary/elongation_lower
    - time_slice(itime)/boundary/triangularity
    - time_slice(itime)/boundary/triangularity_upper
    - time_slice(itime)/boundary/triangularity_lower
    # global quantities
    - time_slice(itime)/global_quantities/beta_pol
    - time_slice(itime)/global_quantities/beta_tor
    - time_slice(itime)/global_quantities/beta_normal
    - time_slice(itime)/global_quantities/ip
    - time_slice(itime)/global_quantities/li_3
    - time_slice(itime)/global_quantities/volume
    - time_slice(itime)/global_quantities/area
    - time_slice(itime)/global_quantities/surface
    - time_slice(itime)/global_quantities/length_pol
    - time_slice(itime)/global_quantities/psi_axis
    - time_slice(itime)/global_quantities/psi_boundary
    - time_slice(itime)/global_quantities/magnetic_axis/r
    - time_slice(itime)/global_quantities/magnetic_axis/z
    - time_slice(itime)/global_quantities/magnetic_axis/b_field_tor
    - time_slice(itime)/global_quantities/q_axis
    - time_slice(itime)/global_quantities/q_95
    - time_slice(itime)/global_quantities/q_min/value
    - time_slice(itime)/global_quantities/q_min/rho_tor_norm
    - time_slice(itime)/global_quantities/energy_mhd
    # 1d profiles
    - time_slice(itime)/profiles_1d/psi
    - time_slice(itime)/profiles_1d/phi
    - time_slice(itime)/profiles_1d/pressure
    - time_slice(itime)/profiles_1d/f
    - time_slice(itime)/profiles_1d/dpressure_dpsi
    - time_slice(itime)/profiles_1d/f_df_dpsi
    - time_slice(itime)/profiles_1d/j_tor
    - time_slice(itime)/profiles_1d/j_parallel
    - time_slice(itime)/profiles_1d/q
