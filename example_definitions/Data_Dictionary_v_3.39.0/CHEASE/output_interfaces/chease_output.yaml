    - time_slice(itime)/profiles_2d(i1)/phi
    - time_slice(itime)/profiles_2d(i1)/j_tor
    - time_slice(itime)/profiles_2d(i1)/j_parallel
    - time_slice(itime)/profiles_2d(i1)/b_field_r
    - time_slice(itime)/profiles_2d(i1)/b_field_z
    - time_slice(itime)/profiles_2d(i1)/b_field_tor
