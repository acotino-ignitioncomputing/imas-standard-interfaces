    - time_slice(itime)/profiles_1d/gm6
    - time_slice(itime)/profiles_1d/gm7
    - time_slice(itime)/profiles_1d/gm8
    - time_slice(itime)/profiles_1d/gm9
    - time_slice(itime)/profiles_1d/b_field_average
    - time_slice(itime)/profiles_1d/b_field_min
    - time_slice(itime)/profiles_1d/b_field_max
    - time_slice(itime)/profiles_1d/beta_pol
    # 2d profiles
    - time_slice(itime)/profiles_2d(i1)/type/name
