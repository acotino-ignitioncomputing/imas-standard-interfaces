dd_version: 4.0.0

paths:
- all_of:
  - equilibrium/ids_properties/version_put/data_dictionary
  - equilibrium/time(1)
  - equilibrium/time_slice(1)/boundary/outline/r
  - equilibrium/time_slice(1)/boundary/outline/z
  - equilibrium/vacuum_toroidal_field/b0
  - equilibrium/vacuum_toroidal_field/r0
  - pf_active/coil/element/turns_with_sign
  - pf_active/coil/resistance
  - pf_active/ids_properties/version_put/data_dictionary
  - pf_passive/ids_properties/version_put/data_dictionary
  - pf_passive/loop/resistance
  - wall/description_2d(1)/limiter/unit/outline/r
  - wall/description_2d(1)/limiter/unit/outline/z
  - wall/description_2d(1)/mobile/unit/outline(1)/r
  - wall/description_2d(1)/mobile/unit/outline(1)/z
  - wall/description_2d(1)/vessel/unit(1)/annular/centreline/r
  - wall/description_2d(1)/vessel/unit(2)/annular/centreline/r
  - wall/description_2d(1)/vessel/unit(1)/annular/centreline/z
  - wall/description_2d(1)/vessel/unit(2)/annular/centreline/z
  - wall/description_2d(1)/vessel/unit/annular/resistivity
  - wall/description_2d(1)/vessel/unit(1)/annular/thickness
  - wall/description_2d(1)/vessel/unit(2)/annular/thickness
  - wall/ids_properties/version_put/data_dictionary

- all_or_none:
  - iron_core/ids_properties/version_put/data_dictionary
  - iron_core/segment/b_field
  - iron_core/segment/geometry/outline/r
  - iron_core/segment/geometry/outline/z
  - iron_core/segment/permeability_relative

- any_of:
  - equilibrium/time_slice(1)/profiles_1d/psi
  - equilibrium/time_slice(1)/profiles_1d/dpressure_dpsi
  - equilibrium/time_slice(1)/profiles_1d/f_df_dpsi

constraints:
  allowed_values:
  - pf_active/coil/element(1)/geometry/geometry_type: [1,2]
  - pf_passive/loop/element(1)/geometry/geometry_type: [1, 2]

  value_range:
  - equilibrium/time_slice(1)/profiles_1d/psi: [0.0, 1.0]
  - equilibrium/time_slice(1)/global_quantities/ip: [-.inf, 1.0e+9]

  has_shape:
  - pf_active/coil/element(1)/geometry/outline/r: [5]
  - pf_active/coil/element(1)/geometry/outline/z: [5]
