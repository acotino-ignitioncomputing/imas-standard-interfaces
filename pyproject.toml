[build-system]
requires = ["setuptools>=61.0", "packaging"]
build-backend = "setuptools.build_meta"

[project]
name = "imas-standard-interfaces"
version = "0.1.0"
description = "Standardized schemas and interfaces for scientific data formats used in IMAS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.8",
    "imas-python>=2.2.0",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
'interfaceTools' = ['../schemas/json_schema.json']

[project.scripts]
imas-interfaces = "interfaceTools.cli:main"

[project.optional-dependencies]
linting = [
    "ruff",
]


[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]