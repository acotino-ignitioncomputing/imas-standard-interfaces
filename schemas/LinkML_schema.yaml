# LinkML schema for IMAS interface definitions
# Captures the rules described in definitions/structure_of_definitions.md
# Validates YAML files such as those in definitions/efit++/
#
# To check whether the syntax of the schema itself is correct with respect to
# LinkML-syntax, use the command
# linkml-term-validator validate-schema schemas/LinkML_schema.yaml

id: https://github.com/iterorganization/imas-standard-interfaces/schemas/LinkML_schema
name: LinkML_schema
title: IMAS Interface Definition Schema
description: >-
  Schema for interface definitions that describe input and output datasets for
  simulation code using IMAS. These definitions are written in YAML and use
  references to the IDSs in the IMAS Data Dictionary.

prefixes:
  linkml: https://w3id.org/linkml/

imports:
  - linkml:types

classes:
  InterfaceDefinition:
    description: >-
      A top-level interface definition document. At least one of `ids` or
      `include` must be present.
    tree_root: true
    attributes:
      dd_version:
        description: >-
          The version of the IMAS Data Dictionary that this definition targets.
        required: true
        pattern: "^[0-9]{1,}\\.[0-9]{1,}\\.[0-9]{1,}"
      ids:
        description: >-
          Contains a list of class 'IDSClass', holding the IDS name, the
          required paths and (optionally) the constraints applied to certain
          paths.
        multivalued: true
        range: IDSClass
        inlined: true
        required: false
      include:
        description: >-
          A sequence of relative file paths, where each path points to a
          YAML-file having the same structure as this document. Including files
          is equivalent to concatenating the `ids` and `include` lists from the
          referenced files.
        multivalued: true
        required: false
    rules:
      - postconditions:
          any_of:
            - slot_conditions:
                ids:
                  required: true
            - slot_conditions:
                include:
                  required: true
        description: >-
          At least one of `ids` or `include` must be present in each definition
          file. Both may be present simultaneously.

  IDSClass:
    description: >-
      This class holds the IDS name, the required paths and (optionally) the
      constraints applied to certain paths.
    attributes:
      ids_name: 
        description: >-
          Name of the IDS.
        range: string
      required_paths:
        description: >-
          IDS paths that need to be present in the dataset.
        required: true
        multivalued: true
        range: string
      constraints:
        description: >-
          Constraints applied to IDS paths.
        required: false
        multivalued: true
        range: PathConstraint

  PathConstraint:
    attributes:
      path:
        description: >-
          List of IDS paths for which the constraints hold.
        required: true
        multivalued: true
        range: string
      allowed_values:
        description: >-
          Data array at this IDS path must only consist of the listed values.
        required: false
        multivalued: true
        exactly_one_of:
          - range: string
          - range: integer
      has_shape:
        description: >-
          Data array at this IDS path must have the indicated shape.
        required: false
        multivalued: true
      value_range:
        description: >-
          The values of the data array at this IDS path must fall within given
          range.
        required: false
        multivalued: true
        range: float
        exact_cardinality: 2
      at_least_one_present:
        description: >-
          Indicates that at least one of the the listed paths must be present.
        required: false
        ifabsent: null
      same_shape:
        description: >-
          Indicates that the data arrays of the listed paths must have the same
          shape.
        required: false
        ifabsent: null
      # TODO: add other constraints (value_range, at_least_one_present, has_shape, same_shape)
